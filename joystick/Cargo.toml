[workspace]

[package]
name = "joystick"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
stm32f0xx-hal = { version = "0.18", features = ["stm32f030x6", "rt"]}
panic-halt = "*"
embedded-hal = "0.2"
protocol = { path = "../protocol" }

# Optional dependencies, when stm32f0xx-hal will implement the embedded-hal 1.0
#embedded-hal = "1.0"
#embedded-hal-bus = "0.3"
#ssd1306 = "0.10.0"

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "z"
