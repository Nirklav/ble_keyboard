[package]
name = "desktop"
version = "0.2.7"
edition = "2024"

[[bin]]
name = "kb"
path = "src/main.rs"

[[bin]]
name = "kb-gui"
path = "src/bin/kb-gui/main.rs"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
futures = "0.3.34"
protocol = { version = "0.1.0", path = "../protocol", features = ["std"] }
serde = "1.0.229"
toml = "1.1.8"

# build.rs checks the bundled firmware image.
[build-dependencies]
protocol = { version = "0.1.0", path = "../protocol", features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "x11", "clipboard", "accesskit"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev", "windows-native"] }
rfd = "0.17.2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }

# Browser build (`trunk build`, see index.html): the keyboard over WebHID. The WebHID bindings of web-sys
# are unstable, see the rustflags in .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BeforeUnloadEvent",
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomException",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "Hid",
    "HidCollectionInfo",
    "HidDevice",
    "HidDeviceFilter",
    "HidDeviceRequestOptions",
    "HidInputReportEvent",
    "Location",
    "Navigator",
    "Url",
    "Window",
] }
