# Factory config of the keyboard (`default_config()` in keyboard/src/layout.rs).
#
# rows[y][x]: 5 rows of 10 keys per layout. Key actions:
#   { Key = "A" }, { KeyWithMod = ["Num1", "LeftShift"] }, { Mod = "LeftCtrl | LeftAlt" },
#   { Media = "VolumeUp" }, { MouseKey = "Left" }, { MouseTravel = { dx = 0, dy = -10 } },
#   { MouseScroll = { dy = 2 } }, { Fn = { temporary = 1, permanent = 2 } }, "None",
#   "Transparent", { Momentary = 1 }, { Toggle = 1 }, { To = 2 },
#   { ModTap = { mods = "LeftCtrl", tap = "F" } }, { LayerTap = { layer = 1, tap = "Space" } },
#   { BtSelect = 0 }, "BtNext", "BtPrev", "BtClear".
# Fn: layout index while held / after a double tap, at most one per layout.
# Layers: the base layer (layout 0 after boot) and layers on top of it. Momentary: on top while held;
# Toggle: on top / off; To: the new base layer, the others off. Transparent: the key of the layer below.
# ModTap / LayerTap: tap sends `tap`, hold holds `mods` / the layer. A hold is a key held for
# settings.tapping_term_ms or held while another key is pressed and released; pressed within
# settings.require_prior_idle_ms after a typed key it's a tap (0 turns that off).
# MouseTravel: cursor speed while held, pixels per 10 ms (10 = 1000 px/s); MouseScroll: wheel steps
# per second, a press scrolls one step at once. Both move by the time, whatever the report rate is.
# Other settings: debounce_ms (key contact bounce), sleep_connected_s / sleep_disconnected_s
# (deep sleep after that many idle seconds with / without a host, 15..36000), joystick_speed (cursor
# px/s at full deflection), joystick_ramp_ms (time to reach that speed, 0 = at once), joystick_invert_x/y.
# BLE profiles: the keyboard remembers 4 hosts, one per profile; the display shows them as BT 1..BT 4,
# BtSelect takes 0..3. Switching drops the current host and connects to the host of the profile, an empty
# profile waits for a new host to pair (display: "BT 2 pair"). BtClear forgets the host of the current
# profile; the host has to remove the keyboard before it pairs again.
# joystick: actions of the joystick buttons in the layout (any key action but Fn),
# mouse buttons if left out.
# Combos: keys by { Coord = { x, y } } or { Action = <key action> }; count = number of
# presses, 0 = must be held, at least one key needs presses.
# Actions: "SwitchLayout", { SetLayout = 2 }, "ResetConfig", { BtSelect = 0 }, "BtNext", "BtPrev",
# "BtClear", "BtClearAll" (forgets all hosts); "Unpair" is the same as "BtClear".
# Factory combos: double tap Fn: SwitchLayout; hold Fn, press Left x3: Unpair; hold Fn, double press
# Q, Z, X, C: BT 1..BT 4 (keys that are "None" in FUNCTION, so nothing is typed on the host being left).
# Chords: a combo with an `action = { Action = ... }` is a chord, its keys (all with count = 0) pressed
# together within settings.combo_term_ms send the action instead of their own ones while held, e.g.
#   keys = [{ ident = { Coord = { x = 6, y = 1 } }, count = 0 }, { ident = { Coord = { x = 7, y = 1 } }, count = 0 }]
#   action = { Action = { Key = "Escape" } }
# Check with `kb check examples/config.toml`, write with `kb push examples/config.toml`.

version = 4
width = 10
height = 5

[settings]
tapping_term_ms = 200
require_prior_idle_ms = 150
combo_term_ms = 50
debounce_ms = 5
sleep_connected_s = 300
sleep_disconnected_s = 60
joystick_speed = 1800
joystick_ramp_ms = 40
joystick_invert_x = false
joystick_invert_y = false

[[layouts]]
name = "MAIN"
rows = [
    [{ Key = "Escape" },   { KeyWithMod = ["Num1", "LeftShift"] }, { KeyWithMod = ["Num2", "LeftShift"] },    { KeyWithMod = ["Num3", "LeftShift"] }, { KeyWithMod = ["Num7", "LeftShift"] }, { Key = "KpAsterisk" }, { Key = "LeftBracket" }, { Key = "RightBracket" }, { Key = "Minus" },     { Key = "Equal" }],
    [{ Key = "Q" },        { Key = "W" },                          { Key = "E" },                             { Key = "R" },                          { Key = "T" },                          { Key = "Y" },          { Key = "U" },           { Key = "I" },            { Key = "O" },         { Key = "P" }],
    [{ Key = "A" },        { Key = "S" },                          { Key = "D" },                             { Key = "F" },                          { Key = "G" },                          { Key = "H" },          { Key = "J" },           { Key = "K" },            { Key = "L" },         { Key = "Semicolon" }],
    [{ Key = "Z" },        { Key = "X" },                          { Key = "C" },                             { Key = "V" },                          { Key = "B" },                          { Key = "N" },          { Key = "M" },           { Key = "Comma" },        { Key = "Dot" },       { Key = "Slash" }],
    [{ Mod = "LeftCtrl" }, { Mod = "LeftShift" },                  { Fn = { temporary = 1, permanent = 2 } }, { Mod = "LeftAlt" },                    { Key = "Backspace" },                  { Key = "Space" },      { Key = "Enter" },       { Key = "Apostrophe" },   { Key = "Backslash" }, { Key = "Tab" }],
]
joystick = { left = { MouseKey = "Left" }, stick = { MouseKey = "Middle" }, right = { MouseKey = "Right" } }

[[layouts]]
name = "FUNCTION"
rows = [
    [{ Key = "Grave" },    { Key = "F1" },        { Key = "F2" },  { Key = "F3" },      { Key = "F4" },     { Key = "F5" },    { Key = "LeftBracket" }, { Key = "RightBracket" }, { KeyWithMod = ["Num9", "LeftShift"] }, { KeyWithMod = ["Num0", "LeftShift"] }],
    ["None",               { Key = "F6" },        { Key = "F7" },  { Key = "F8" },      { Key = "F9" },     { Key = "F10" },   { Key = "Num7" },        { Key = "Num8" },         { Key = "Num9" },                       { Key = "KpAsterisk" }],
    [{ Key = "CapsLock" }, { Key = "F11" },       { Key = "F12" }, { Key = "Up" },      { Key = "Up" },     { Key = "Up" },    { Key = "Num4" },        { Key = "Num5" },         { Key = "Num6" },                       { Key = "KpPlus" }],
    ["None",               "None",                "None",          { Key = "Left" },    { Key = "Down" },   { Key = "Right" }, { Key = "Num1" },        { Key = "Num2" },         { Key = "Num3" },                       { Key = "KpDot" }],
    [{ Mod = "LeftCtrl" }, { Mod = "LeftShift" }, "None",          { Mod = "LeftAlt" }, { Key = "Delete" }, { Key = "Space" }, { Key = "Num0" },        { Key = "Minus" },        { Key = "Slash" },                      { Key = "KpEnter" }],
]
joystick = { left = { MouseKey = "Left" }, stick = { MouseKey = "Middle" }, right = { MouseKey = "Right" } }

[[layouts]]
name = "GAME"
rows = [
    [{ Key = "Escape" },   { Key = "Num1" },      { Key = "Num2" },                          { Key = "Num3" },    { Key = "Num4" },      { Key = "Num5" },  { Key = "Num6" },  { Key = "RightBracket" },               { Key = "Minus" },                      { Key = "Equal" }],
    [{ Key = "Q" },        { Key = "W" },         { Key = "E" },                             { Key = "R" },       { Key = "T" },         { Key = "Y" },     { Key = "U" },     { Key = "I" },                          { Key = "O" },                          { MouseScroll = { dy = 2 } }],
    [{ Key = "A" },        { Key = "S" },         { Key = "D" },                             { Key = "F" },       { Key = "G" },         { Key = "H" },     { Key = "J" },     { Key = "K" },                          { Key = "L" },                          { MouseScroll = { dy = -2 } }],
    [{ Key = "Z" },        { Key = "X" },         { Key = "C" },                             { Key = "V" },       { Key = "B" },         { Key = "N" },     { Key = "M" },     { MouseKey = "Left" },                  { MouseTravel = { dx = 0, dy = -10 } }, { MouseKey = "Right" }],
    [{ Mod = "LeftCtrl" }, { Mod = "LeftShift" }, { Fn = { temporary = 1, permanent = 0 } }, { Mod = "LeftAlt" }, { Key = "Backspace" }, { Key = "Space" }, { Key = "Enter" }, { MouseTravel = { dx = -10, dy = 0 } }, { MouseTravel = { dx = 0, dy = 10 } },  { MouseTravel = { dx = 10, dy = 0 } }],
]
joystick = { left = { MouseKey = "Left" }, stick = { MouseKey = "Middle" }, right = { MouseKey = "Right" } }

[[combos]]
keys = [{ ident = { Coord = { x = 2, y = 4 } }, count = 2 }]
action = "SwitchLayout"

[[combos]]
keys = [{ ident = { Coord = { x = 2, y = 4 } }, count = 0 }, { ident = { Coord = { x = 3, y = 3 } }, count = 3 }]
action = "Unpair"

[[combos]]
keys = [{ ident = { Coord = { x = 2, y = 4 } }, count = 0 }, { ident = { Coord = { x = 0, y = 1 } }, count = 2 }]
action = { BtSelect = 0 }

[[combos]]
keys = [{ ident = { Coord = { x = 2, y = 4 } }, count = 0 }, { ident = { Coord = { x = 0, y = 3 } }, count = 2 }]
action = { BtSelect = 1 }

[[combos]]
keys = [{ ident = { Coord = { x = 2, y = 4 } }, count = 0 }, { ident = { Coord = { x = 1, y = 3 } }, count = 2 }]
action = { BtSelect = 2 }

[[combos]]
keys = [{ ident = { Coord = { x = 2, y = 4 } }, count = 0 }, { ident = { Coord = { x = 2, y = 3 } }, count = 2 }]
action = { BtSelect = 3 }
