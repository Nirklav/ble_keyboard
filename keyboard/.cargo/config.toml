[build]
target = "riscv32imc-esp-espidf"
target-dir = "../target"

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
runner = "sh scripts/flash.sh"
rustflags = [ "--cfg",  "espidf_time64"] # Extending time_t for ESP IDF 5: https://github.com/esp-rs/rust/issues/110

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c3"
ESP_IDF_VERSION = "v5.5"
# ESP-IDF and its tools are shared between several projects
ESP_IDF_TOOLS_INSTALL_DIR = "custom:/home/anton/sources/rust/.embuild"
# embuild takes the parent of target-dir as the crate root (to find sdkconfig.defaults etc.),
# but target-dir is shared with the other projects, so point it to this crate explicitly
CARGO_WORKSPACE_DIR = { value = ".", relative = true }

# Workaround for https://github.com/esp-rs/esp-idf-template/issues/174 
CRATE_CC_NO_DEFAULTS = "1"
